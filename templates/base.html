<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="jW3KVlChGtStdKpCT1FIkqk47m4stjOu-T067opwdmA" />
    <meta name="description"
        content="{% block description %}CutStack - The best free online PDF N-up imposition tool and operational logic visualizer.{% endblock %}">

    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png', v=3) }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png', v=3) }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png', v=3) }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest', v=3) }}">

    <title>{% block title %}CutStack – Online PDF Editor{% endblock %}</title>


    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=3) }}">
    {% block head %}{% endblock %}
</head>

<body>
    <div class="container main-wrapper">
        <div class="nav-logo" style="text-align: center; margin-top: 20px;">
            <a href="/">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="CutStack Logo" class="nav-logo-img"
                    style="max-height: 50px;">
                <br>
                <span class="nav-brand" style="font-size: 1.5rem; color: #333; text-decoration: none;">CutStack</span>
            </a>
        </div>

        {% block content %}{% endblock %}


    </div>



    <script src="{{ url_for('static', filename='script.js', v=6) }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
